<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>GCN Fahrzeughandel – Vorschau</title>
    <style>
      /* 1:1-Nachbau der ersten Sektion von gcn-fahrzeughandel.de.
         Eigenständig, System-Fonts (wie im Original), nicht scrollbar. */
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .hero {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #000;
      }
      .hero__bg {
        position: absolute;
        inset: 0;
        background-image: url("/gcn-hero-bg.png");
        background-size: cover;
        background-position: center;
        opacity: 0.55;
        pointer-events: none;
      }
      .hero__grad-v {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          to top,
          #000 0%,
          rgba(0, 0, 0, 0.55) 50%,
          rgba(0, 0, 0, 0.2) 100%
        );
      }
      .hero__grad-h {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          to right,
          rgba(0, 0, 0, 0.25),
          transparent,
          rgba(0, 0, 0, 0.25)
        );
      }

      .hero__inner {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 56rem;
        margin: 0 auto;
        padding: 0 1.25rem;
        text-align: center;
      }
      .hero__eyebrow {
        font-size: 0.75rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #9ca3af;
        margin: 0 0 1.5rem;
      }
      .hero__title {
        font-size: 2.25rem;
        line-height: 1.08;
        letter-spacing: -0.025em;
        color: #fff;
        font-weight: 300;
        margin: 0 0 1.5rem;
      }
      .hero__title strong { font-weight: 700; }
      .hero__sub {
        font-size: 1rem;
        line-height: 1.75;
        color: #d1d5db;
        font-weight: 300;
        max-width: 42rem;
        margin: 0 auto 2.5rem;
      }
      .hero__cta {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        justify-content: center;
        padding: 0 0.5rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.625rem;
        padding: 1rem 2rem;
        border-radius: 1rem;
        font-size: 0.875rem;
        letter-spacing: 0.025em;
        text-decoration: none;
        border: 1px solid transparent;
        white-space: nowrap;
      }
      .btn svg { width: 1rem; height: 1rem; flex-shrink: 0; }
      .btn--primary {
        background: #fff;
        color: #000;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3),
          0 4px 6px -4px rgba(0, 0, 0, 0.3);
      }
      .btn--secondary {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border-color: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }

      /* Tailwind-Breakpoints 1:1: sm 640 / md 768 / lg 1024 */
      @media (min-width: 640px) {
        .hero__inner { padding: 0 2rem; }
        .hero__eyebrow { margin-bottom: 2rem; }
        .hero__title { font-size: 3.75rem; margin-bottom: 2rem; }
        .hero__sub { font-size: 1.125rem; margin-bottom: 3.5rem; }
        .hero__cta { flex-direction: row; gap: 1rem; }
      }
      @media (min-width: 768px) {
        .hero__title { font-size: 4.5rem; }
        .hero__sub { font-size: 1.25rem; }
      }
      @media (min-width: 1024px) {
        .hero__title { font-size: 6rem; }
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div class="hero__bg"></div>
      <div class="hero__grad-v"></div>
      <div class="hero__grad-h"></div>

      <div class="hero__inner">
        <p class="hero__eyebrow">
          GCN Fahrzeughandel GbR · Sankt Georgen im Schwarzwald
        </p>
        <h1 class="hero__title">
          Ihr persönlicher<br /><strong>Fahrzeugexperte.</strong>
        </h1>
        <p class="hero__sub">
          Wir übernehmen Suche und Verkauf Ihres Fahrzeugs – vollständig, diskret
          und zu besten Konditionen.
        </p>
        <div class="hero__cta">
          <a class="btn btn--primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
            Auftrag erstellen
          </a>
          <a class="btn btn--secondary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 8-2 2-1.5-3.7A2 2 0 0 0 15.646 5H8.4a2 2 0 0 0-1.903 1.257L5 10 3 8"></path><path d="M7 14h.01"></path><path d="M17 14h.01"></path><rect width="18" height="8" x="3" y="10" rx="2"></rect><path d="M5 18v2"></path><path d="M19 18v2"></path></svg>
            Bestand ansehen
          </a>
        </div>
      </div>
    </section>
  </body>
</html>
